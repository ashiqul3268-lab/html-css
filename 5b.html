<!DOCTYPE html>
<html>
  <head>
    <title>Verdana</title>
    <style>
      p {
        font-family: Verdana;
        margin-top: 0;
        margin-bottom: 0;
      }
    .title {
      font-weight: bold;
      margin-bottom: 2px;
      font-size: 17px;
    }
    .pro {
      color: rgb(96, 96, 96);
      font-size: 15px;
      margin-bottom: 17px;
    }
    .discription {
      width: 300px;
      margin-bottom: 15px;
      line-height: 22px;
    }
    .start {
      background-color: green;
      border: none;
      font-family: Verdana;
      color: white;
      border-radius: 6px;
      padding-left: 13px;
      padding-right: 13px;
      padding-top: 5px;
      padding-bottom: 5px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    </style>
  </head>
  <body>
    <p class="title">HTML CSS 
      COURSE
    </p>
    <p class="pro">Beginner 
      to Pro</p>
    <p class="discription">In 
      this course, we'll learn 
      the skills you need to 
      become a developer.</p>
    <button class="start">Get 
      Started</button>
  </body>
</html>
