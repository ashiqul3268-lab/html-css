<!DOCTYPE html>
<html>
  <head>
    <title>5e</title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
        text-align: center;;
      }
      .new {
        color: rgb(240, 137, 10);
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 10px;
      }
      .product {
        font-weight: bold;
        font-size: 24px;
        margin-bottom: 5px;
      }
      .title {
        font-weight: bold;
        font-size: 45px;
        margin-bottom: 15px;
      }
      .price {
        margin-bottom: 25px;
      }
      .button {
        border: none;
        background-color: rgb(9, 143, 232);
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 7px;
        padding-bottom: 7px;
        border-radius: 30px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <p class="new">New</p>
    <p class="product">MacBook 
      Pro
    </p>
    <p class="title">Supercharged 
      for pros
    </p>
    <p class="price">From $1999</p>
    <button class="button">Buy</button>
  </body>
</html>
