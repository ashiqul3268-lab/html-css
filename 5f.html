<!DOCTYPE html>
<html>
  <head>
    <title>5f</title>
    <style>
      p {
        font-family: Arial;
        margin-bottom: 0;
        margin-top: 0;
      }
      .amount {
        font-size: 35px;
        margin-right: 5px;
      }
      .usd {
        color: rgb(96, 96, 96);
        font-size: 19px;
      }
      .plus {
        color: green;
        margin-top: 8px;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .time {
        color: rgb(96, 96, 96);
        font-size: 18px;
        margin-right: 3px;
      }
      .minus {
        font-size: 18px;
        color: rgb(180, 39, 39);
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <p>
      <span class="amount">1,049.61</span>
      <span class="usd">USD</span>
    </p>
    <p class="plus">+18.05 (1.75%) today</p>
    <p><span class="time">After hours 1,048.00</span>
    <span class="minus">-1.61 (0.15%)</span>
    </p>
  </body>
</html>
